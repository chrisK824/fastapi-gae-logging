name: Continuous Integration Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:

jobs:
  quality:
      name: Lint with Ruff
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Install uv
          uses: astral-sh/setup-uv@v7
          with:
            enable-cache: true
        - name: Run Ruff
          run: uvx ruff check --output-format=github .

  test:
     name: Tests
     needs: quality
     runs-on: ubuntu-latest
     env:
        UV_PYTHON: "3.14"

     steps:
       - uses: actions/checkout@v7
       - name: Install uv
         uses: astral-sh/setup-uv@v7
         with:
           enable-cache: true

       - name: Install dependencies
         run: uv sync

       - name: Run tests
         run: uv run pytest tests
